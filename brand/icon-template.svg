<?xml version="1.0" encoding="UTF-8"?>
<!--
  OnlyRead macOS 菜单栏 template image（brand/icon-template.svg）
  ================================================================
  规格要求（macOS NSImage template image）
  ---------------------------------------
  * 只能含纯黑 #000000 与透明 alpha；出现任何其它颜色（含灰、白）都不会被
    当作 template 处理，而会被原样绘制。因此本文件**没有**渐变底、没有白色书本，
    只有一条 fill="#000000" 的路径。
  * 菜单栏图标是**不透明剪影**：它会被系统整体反相（浅色菜单栏显示黑、
    深色菜单栏显示白），所以"中缝"不能靠颜色对比，只能靠**透明镂空**。
    本文件的两页之间没有任何像素（背景透出来），这点由 verify 脚本按
    "中缝列 alpha 必须为 0" 逐像素断言。

  为什么选"黑色实心剪影"而不是"黑色描边轮廓"
  ------------------------------------------
  菜单栏实际显示高度只有 16~22px。描边轮廓在这个尺寸下：一条 1~1.5px 的线
  经抗锯齿后只剩 30%~50% 的覆盖率，反相到深色菜单栏上会变成一圈发灰的细线，
  对比度损失不可控；而且轮廓内部是镂空的，16px 时"书的内部"会和菜单栏背景
  糊成一片，读不出形状。实心剪影的对比度只由 alpha 决定（要么是黑、要么是
  背景），在 1x/2x 下都稳定，也是 SF Symbols 一贯的做法。代价是细节少，
  但菜单栏图标本来就只承载"一个可辨认的剪影"。

  几何（22x22 viewBox，对齐 make-icon.py 的 100x100 视口，k = 22/100）
  ------------------------------------------------------------------
  留白 2 单位（≈ SF Symbols 的 2pt 边距），书本按 BOOK_SMALL 档：
    书宽 = 22 * 0.74 = 16.28  -> x 2.86 ~ 19.14
    书高 = 22 * 0.62 = 13.64  -> y 4.18 ~ 17.82
    中缝 = 书宽 * 0.14 = 2.2792 -> 中线 11 左右各 1.1396（左页右边界 9.8604，
                                   右页左边界 12.1396）
    两页之间的 2.2792 单位完全透明：16px 下约 1.66px，22px 下 2.28px
    页顶收束 slope = 0.10：外缘 y = 4.18，内缘 y = 4.18 + 0.10*(22/100) = 4.202
    （只为了让顶边有个朝内的浅 V 折角；菜单栏尺寸下几乎不可见，保留是为了
      和应用图标同一套几何语言）

  重新生成：本文件是手写 SVG（几何常量与 brand/make-icon.py 的 BOOK_SMALL 一致，
  圆角/渐变那部分不适用于 template）。改用例后要同步三处，否则会互相不一致：
    1) 本文件的 path 数据；
    2) brand/icon-template.png（22x22）与 brand/icon-template@2x.png（44x44）
       两张光栅图 —— 它们由本文件按"每像素 256 条扫描线的解析式面积覆盖率"
       生成，纯黑 + alpha，不引入任何灰；
    3) 断言：中缝列必须是 alpha 全 0 的透明镂空（22px 为 x=10,11；44px 为
       x=20..23），两页各自 alpha 全 255，全图颜色只能是 (0,0,0)。
  生成/校验方法与命令见 brand/README.md。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <title>OnlyRead menu bar (template)</title>
  <path fill="#000000" d="M2.86 4.18 9.8604 4.202 9.8604 17.82 2.86 17.82Z M12.1396 4.202 19.14 4.18 19.14 17.82 12.1396 17.82Z"/>
</svg>
